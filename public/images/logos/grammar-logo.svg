<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Grammar">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f06b7d"/>
      <stop offset="1" stop-color="#c2364f"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" fill="#121214"/>
  <!-- sentence blocks: subject · verb · object -->
  <rect x="22" y="44" width="40" height="26" rx="7" fill="#2a2a30"/>
  <rect x="68" y="44" width="30" height="26" rx="7" fill="url(#g)"/>
  <rect x="104" y="44" width="34" height="26" rx="7" fill="#2a2a30"/>
  <!-- second line, block being moved into place -->
  <rect x="22" y="80" width="52" height="26" rx="7" fill="#2a2a30"/>
  <rect x="80" y="86" width="40" height="26" rx="7" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="6 5"/>
  <!-- check mark -->
  <path d="M60 128 l10 10 l22 -24" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
