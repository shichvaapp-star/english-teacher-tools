<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Grammar Practice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1d1d22"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b31"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a64"/>
      <stop offset="0.5" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#7a3446"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4f73" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#ff4f73" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff4f73" stop-opacity="0"/>
    </radialGradient>
    <!-- frosted neutral glass -->
    <linearGradient id="glassFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4eef0" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#c9c2c7" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#8f8790" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="glassSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8189"/>
      <stop offset="1" stop-color="#4a444b"/>
    </linearGradient>
    <!-- glowing rose glass -->
    <linearGradient id="roseFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3c2" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ff5c7c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c41f48" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="roseSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3213f"/>
      <stop offset="1" stop-color="#6d0f26"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blur4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <!-- piece with a knob on the right (left piece) -->
    <path id="pieceA" d="M150 190 q0 -10 10 -10 h100 q10 0 10 10 v32 a30 30 0 1 1 0 56 v32 q0 10 -10 10 h-100 q-10 0 -10 -10 z"/>
    <!-- piece with a socket on the left (right piece) -->
    <path id="pieceB" d="M280 180 h100 q10 0 10 10 v120 q0 10 -10 10 h-100 q-10 0 -10 -10 v-32 a30 30 0 1 0 0 -56 v-32 q0 -10 10 -10 z"/>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- app tile -->
  <g filter="url(#tileShadow)">
    <rect x="72" y="72" width="368" height="368" rx="78" fill="url(#tile)"/>
  </g>
  <rect x="73.5" y="73.5" width="365" height="365" rx="77" fill="none" stroke="url(#tileEdge)" stroke-width="3"/>

  <!-- rose glow under the pieces -->
  <ellipse cx="270" cy="275" rx="150" ry="110" fill="url(#glow)"/>

  <g transform="translate(-14 22)">
    <!-- left piece: frosted glass -->
    <use href="#pieceA" fill="url(#glassSide)" transform="translate(7 12)"/>
    <use href="#pieceA" fill="url(#glassFace)"/>
    <use href="#pieceA" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5"/>
    <path d="M162 186 h94" stroke="url(#shine)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <path d="M156 196 v70" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>

    <!-- right piece: glowing rose glass, lifted as it clicks in -->
    <g transform="translate(18 -16) rotate(-6 340 250)">
      <use href="#pieceB" fill="#ff4f73" opacity="0.65" filter="url(#soft)"/>
      <use href="#pieceB" fill="url(#roseSide)" transform="translate(7 12)"/>
      <use href="#pieceB" fill="url(#roseFace)"/>
      <use href="#pieceB" fill="none" stroke="#ffd2dc" stroke-opacity="0.8" stroke-width="2.5"/>
      <path d="M290 186 h86" stroke="url(#shine)" stroke-width="5" stroke-linecap="round"/>
      <path d="M384 196 v100" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
      <!-- inner light streaks -->
      <path d="M305 300 q40 -40 70 -90" stroke="#ffe3ea" stroke-opacity="0.55" stroke-width="2" fill="none"/>
      <path d="M318 304 q36 -34 62 -76" stroke="#ffe3ea" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
    </g>

    <!-- spark at the joint -->
    <g transform="translate(276 214)">
      <circle r="12" fill="#ff8aa3" opacity="0.6" filter="url(#blur4)"/>
      <path d="M0 -16 L3 -3 L16 0 L3 3 L0 16 L-3 3 L-16 0 L-3 -3 Z" fill="#fff5f7"/>
    </g>
  </g>
</svg>
